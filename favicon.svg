<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ae6"/>
      <stop offset="50%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001844" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <!-- Top Glass Highlight -->
  <path d="M0,120 C0,53.7 53.7,0 120,0 L392,0 C458.3,0 512,53.7 512,120 L512,230 C380,210 260,200 0,300 Z" fill="#ffffff" opacity="0.08"/>
  <!-- Glass Rim -->
  <rect x="10" y="10" width="492" height="492" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="7"/>
  <!-- SG Text -->
  <text x="246" y="328" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="230" font-weight="900" letter-spacing="-6" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">SG</text>
  <!-- Cyan Accent Spark -->
  <circle cx="392" cy="152" r="14" fill="#00f2fe" filter="url(#glow)"/>
</svg>